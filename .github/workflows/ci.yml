name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,examples]
      - name: pytest
        run: pytest
      - name: wording / claim gate
        run: pytest tests/test_wording_gate.py

  frozen-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: checksums (published artifact integrity)
        run: sha256sum -c checksums.sha256
      - name: frozen-zone drift gate (nothing under the frozen paths may change
          after tag science-closed)
        run: |
          BASE=$(git rev-parse science-closed)
          CHANGED=$(git diff --name-only "$BASE" HEAD \
            -- results/synthetic results/gauge_spectrum results/monte_carlo \
               results/nonlinear results/diligent results/diligent_ablation \
               results/openillumination/ci04_formal_summary.json \
               results/openillumination/ci04_formal_manifest.json \
               results/openillumination/mode_ranking.csv \
               results/openillumination/level_severity.csv \
               results/openillumination/predictor_comparison.csv \
               configs/openillumination.yaml tests/test_reproduction.py)
          if [ -n "$CHANGED" ]; then
            echo "FROZEN PATHS MODIFIED:"; echo "$CHANGED"; exit 1
          fi
      - name: manuscript-evidence drift gate (allocation evidence + statistics
          scripts frozen at tag manuscript-evidence-v1)
        run: |
          if ! git rev-parse -q --verify refs/tags/manuscript-evidence-v1 >/dev/null; then
            echo "tag manuscript-evidence-v1 not present yet -- skipping (first run after its introduction)"
            exit 0
          fi
          BASE=$(git rev-parse manuscript-evidence-v1)
          CHANGED=$(git diff --name-only "$BASE" HEAD -- \
            results/openillumination/allocation \
            configs/openillumination_allocation.yaml \
            experiments/openillumination_allocation.py \
            experiments/openillumination_allocation_random48.py \
            tests/test_allocation_known_answers.py \
            tests/test_allocation_run_smoke.py \
            tests/test_manuscript_evidence.py)
          if [ -n "$CHANGED" ]; then
            echo "MANUSCRIPT EVIDENCE PATHS MODIFIED:"; echo "$CHANGED"; exit 1
          fi
