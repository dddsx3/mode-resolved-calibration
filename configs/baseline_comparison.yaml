# P-BASELINE -- literature-style selection baselines on the same light
# sets (TCI gap 3). PREREGISTERED: committed BEFORE the run.
#
# v1.1 (acceptance report d9eb9f2 section 2-3): the v1 DC05 candidate
# pool was ALL lights -- 57-86% of its budget fell on non-illuminating
# lights (measured overlap 3-5 of 14 at k=14), so "DC05 ~ universe-
# random" merely replicated C8 (the active-set effect) and could NOT
# support "geometry-insufficient". v1.1 adds:
#   - dc05_active: the SAME geometry rule with the candidate pool
#     RESTRICTED to the object's active (illuminating) lights;
#   - randomA48 controls (permute the active set only) on both
#     cohorts -- the C8-mandated honest baseline;
#   - per-object overlap recording (dc05 overlap with the active set
#     at each budget) so the v1 confound is self-documenting.
# Preregistered reading rule (replaces v1's, evaluated on the
# ACTIVE-RESTRICTED comparison):
#   geometry-insufficient: dc05_active's median deviation from the
#     randomA48 mean is >= the informed family's median deviation
#     (i.e. geometry still does not beat random on equal effective
#     budget) -- C12 stands, strengthened.
#   geometry-informative: dc05_active's median deviation is BETTER
#     (more negative) than the informed family's -- C12 must be
#     downgraded to "DC05's v1 failure was the visibility confound".
#
# Question: does GEOMETRY-ONLY light selection (the classic
# well-conditioned-configuration idea, Drbohlav & Chantler ICCV 2005)
# capture the allocation value that the calibrated prediction model
# captures? Same lights, same budget frame, same realized endpoint
# (normal angular error) as the frozen E-arm -- only the selection
# rule differs.
#
# Baseline (DC05, operationalized): greedy farthest-point sampling on
# the unit sphere of light DIRECTIONS -- seed = the light closest to
# the camera axis (max z; ties -> lowest index), then iteratively add
# the light MINIMIZING the max dot-product with the selected set (=
# maximizing the min great-circle distance; ties -> lowest index),
# extended greedily to a full permutation. Corruption-model-free,
# prediction-model-free: pure geometry. This is the classical
# "well-spread configuration" surrogate for PS well-posedness.
#
# Frame (identical to the frozen E-arm wherever shared):
#   - OI cohort (11 objects, 142 lights): units = 4 informed policies
#     (mode_aware / e_opt / a_opt / d_opt) + DC05 + 3 universe-random
#     permutations; budgets k in {14, 28} (the power-maximal pair);
#     regime 10; corruption level 0.5 (uniform joint, scalar sigma,
#     rho=0); seeds [20260910, 7777, obj, 1, s] (E-anchor spec);
#     random rng [20260911, obj, 0, p] (frozen DQ spec).
#     HARD ANCHOR: the 4 informed units' rows (pred_J_A / ang_mean_deg
#     / mse_aligned / dual_mean) must be BIT-IDENTICAL to the frozen
#     decision_quality_family.json anchor-arm subset -- the baseline
#     rerun shares the E-arm's orderings and seeds by construction.
#   - DiLiGenT cohort (10 objects, 96 lights): minimal comparable trio
#     = a_opt + DC05 + 3 random (same seeds shape; new queue).
#
# Comparability statement (for Gardi 2022 / ReLeaPS 2023, NOT
# reimplemented): they optimize light POSITIONS / next-light selection
# under their own objectives; we allocate calibration PRECISION among
# EXISTING lights under a Fisher-risk objective. Objectives differ ->
# numbers are not directly comparable; DC05 is the one implementable
# same-lights geometry baseline. Registered in docs, not measured.
#
# Preregistered reading rule (descriptive; both outcomes findings):
#   DC05-informative: DC05's median per-object realized-ang deviation
#                     from the random mean is <= the informed family's
#                     median deviation (geometry alone captures the
#                     allocation value within the informed band).
#   geometry-insufficient: DC05's median deviation is > the informed
#                     family's (geometry-only selection leaves value
#                     on the table that the calibrated model captures).
#   Evaluated per cohort at each budget; all per-object numbers
#   reported regardless.

gate: P-BASELINE
analysis_status: baseline_comparison_v1
run_name: baseline_comparison_v1

oi_data_root: D:/data/OpenIllumination
oi_data_meta: D:/data/OpenIllumination_meta
oi_cohort: [obj_03_pumpkin, obj_04_dolphin, obj_07_pumpkin2, obj_09_ball, obj_10_pumpkin3, obj_11_pine, obj_13_mushroom, obj_16_friends_cup, obj_17_pumpkin5, obj_18_fabric_hat, obj_19_cylinder]
diligent_data_root: D:/data/DiLiGenT/pmsData
diligent_cohort: [ballPNG, bearPNG, buddhaPNG, catPNG, cowPNG, gobletPNG, harvestPNG, pot1PNG, pot2PNG, readingPNG]

noise_fit_convention: corrected
oi_scene_rng_spec: "default_rng([20260910, obj_idx])  # identical to P-CERT / E-arm"
dq_scene_rng_spec: "default_rng([20260915, obj_idx])  # identical to P-DILIGENT-QUEUE"
K_oi: 142
K_dq: 96
kappa: 10.0
level: 0.5
regime: 10
budgets_k: [14, 28]
seeds: 10
random_units: 3
family_seed: 20260915

oi_units: [mode_aware, e_opt, a_opt, d_opt, dc05, dc05_active, randomU_0, randomU_1, randomU_2, randomA48_0, randomA48_1, randomA48_2]
dq_units: [a_opt, dc05, dc05_active, randomU_0, randomU_1, randomU_2, randomA48_0, randomA48_1, randomA48_2]

outcome_rule: >
  v1.1 (active-restricted): geometry-insufficient = dc05_active median
  deviation from the randomA48 mean >= informed median deviation (on
  every cohort x budget cell); geometry-informative = dc05_active
  strictly better than the informed family's median deviation on any
  cell (C12 downgrades to visibility-confound). v1's universe-random
  comparison is retained for reference but is NOT the reading basis.
  Descriptive, no sign gate.

outcome_independence: >
  Every per-object realized endpoint and predicted J_A is reported for
  every unit regardless of outcome. The OI hard anchor (bit-identity
  with the frozen E-arm subset) is the only runtime gate.
