# OpenIllumination controlled-corruption experiment (frozen protocol)
# Validation criterion: spearman(pred_deg, emp_deg) > 0.5 with bootstrap95 lower bound > 0
# If correlation is absent, the real-data chapter is downgraded to a limitation (as pre-registered)
# Seeds: 20 per (level x object); the held-out objects are the frozen test set
# (obj_20_greenhead excluded: the HF side lacks the com_masked_thumbnail layer for it)
run_name: formal
seed: 20260907
data_root: D:/data/OpenIllumination
data_meta: D:/data/OpenIllumination_meta
corruption_type: joint
levels: [0.1, 0.2, 0.35, 0.5, 0.75, 1.0]
seeds_per_level: 20
bootstrap: 1000
gate_spearman_min: 0.5
max_objects: 11
objects: [obj_03_pumpkin, obj_04_dolphin, obj_07_pumpkin2, obj_09_ball, obj_10_pumpkin3, obj_11_pine, obj_13_mushroom, obj_16_friends_cup, obj_17_pumpkin5, obj_18_fabric_hat, obj_19_cylinder]

# --- frozen severity-analysis registration (merged from the frozen CI04 analysis config) ---
dataset: OpenIllumination
split: frozen_test
ctype: joint
n_objects: 11
n_levels: 6
n_modes: 5
n_seeds: 20
expected_cells: 66
expected_mode_points: 330
primary_target: T_ol = max_j emp_deg_j (max over 5 tracked modes; frozen definition)
# severity-analysis thresholds and bootstrap registration
rank_relative_tol: 1.0e-10
retention_clip_tol: 1.0e-10
log_eps: 1.0e-12
bootstrap_seed: 20260908
bootstrap_reps: 10000
practical_margin_delta: 0.05
pass_a_min_median: 0.5
pass_a_min_positive_objects: 9
# frozen artifact checksum chain (results/openillumination/ formal files)
frozen_artifacts_sha256:
